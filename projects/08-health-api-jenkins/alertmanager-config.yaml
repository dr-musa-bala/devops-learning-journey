apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yaml: |
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'peaceautomate@gmail.com'
      smtp_auth_username: 'peaceautomate@gmail.com'
      smtp_auth_password: 'shavgehuofhcjjhj' # Or use the secret reference if using Helm
      smtp_require_tls: true

    route:
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'email-notifications'

    receivers:
    - name: 'email-notifications'
      email_configs:
      - to: 'peaceautomate@gmail.com'
        send_resolved: true
