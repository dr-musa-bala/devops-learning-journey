apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: health-api-monitor
  namespace: monitoring
  labels:
    release: monitoring  # This must match your kube-prometheus-stack release name
spec:
  selector:
    matchLabels:
      app: health-api    # This matches your Service label
  endpoints:
  - port: http           # This refers to the port NAME in your Service (usually 80)
    path: /metrics
    interval: 30s
