apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-api
  template:
    metadata:
      labels:
        app: health-api
    spec:
      containers:
      - name: health-api
        image: health-api:latest
        imagePullPolicy: Always # <--- THIS IS THE CRITICAL LINE
        ports:
        - containerPort: 80
        env:
        - name: APP_LOCATION
          value: "Lagos-Data-Center"
