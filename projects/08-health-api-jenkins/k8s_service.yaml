apiVersion: v1
kind: Service
metadata:
  name: health-app-service
  namespace: default
  labels:
    app: health-api
  annotations:
    prometheus.io/scrape: "true"        # Tells Prometheus to scrape this
    prometheus.io/path: "/metrics"      # The endpoint we just verified
    prometheus.io/port: "80"            # The port inside the container
spec:
  type: NodePort
  selector:
    app: health-app-stack
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30081
