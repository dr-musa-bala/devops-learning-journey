apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: health-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: health-app-stack  # Must match your deployment name exactly
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50  # Scale up if CPU goes over 50%
